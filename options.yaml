# SCAIe dropdown options
# ---------------------------------------------------------------
# Edit this file to change what students can pick.
# - Keep the indentation (2 spaces) and the "- name:" pattern.
# - Text after "description: |" can run over several lines; just keep it indented.
# - Changes show up the next time the app reloads.

settings:
  ideas_per_run: 3              # how many project ideas per generation
  max_generations_per_day: 10   # per student per day; stops one student using up the API credits
  model: gemini-3.8-flash    # Gemini model; "gemini-flash-latest" always points to Google's current Flash model

diplomas:
  - name: Diploma in Early Childhood Development & Education
    description: |
      Recognised by the Early Childhood Development Agency (ECDA) and run with the National Institute
      of Early Childhood Development (NIEC). Prepares students to be preschool educators for children
      aged 18 months to 6 years. Covers child development, motor skills, language and literacy, early
      numeracy, discovery of the world, aesthetics and creative expression, infant and toddler learning
      environments, curriculum planning, and working with children with special needs, with practicums
      in preschools. Tracks in Visual Arts (2D/3D art, digital media, children's book illustration) and
      Malay Mother Tongue teaching. Graduates work as early childhood educators, or move into early
      intervention, family services, curriculum development and play therapy.

  - name: Diploma in Psychology Studies
    description: |
      Builds a foundation in human behaviour and how to apply psychology in social services, special
      needs education and research. Covers social, developmental and cognitive psychology, counselling,
      special needs education, health psychology, abnormal psychology, community psychology, and
      industrial and organisational psychology. Strong focus on research skills: survey design,
      experimental design and statistics, with applied projects and a major project. Graduates work as
      psychology or research assistants, social work associates, special education or early
      intervention teachers, autism coaches, paracounsellors and youth workers.

  - name: Diploma in Social Sciences in Gerontology
    description: |
      The only diploma in Singapore that prepares students to support and empower older adults of
      different abilities, for careers in health, community and social services. Covers the anatomy,
      physiology and psychology of ageing, mental health and dementia management, population health,
      social policy on ageing, coaching and case management, counselling, community development with
      older adults, and advance care planning and end-of-life issues. Graduates work as community care
      executives, social work associates, programme and volunteer management executives, assistant
      health coaches and assistant care coordinators.

themes:
  - name: Urban Biodiversity & City in Nature
    sdgs: "11, 13, 15"
    areas: Urban wildlife, natural habitats, biodiversity conservation, green spaces, human–nature relationships

  - name: Singapore's Food Security & Resilience
    sdgs: "2, 12, 13"
    areas: Food supply, food imports, local food production, food resilience, sustainable food sources

  - name: Reducing Food Waste & Responsible Eating
    sdgs: "2, 12, 13"
    areas: Food waste, portion sizes, consumption habits, food disposal, responsible eating

  - name: Sustainable Consumption & Circular Economy
    sdgs: "8, 12, 13"
    areas: Fast fashion, consumer behaviour, repair and reuse, sharing, upcycling, product life cycles

  - name: Waste, Recycling & Sustainable Packaging
    sdgs: "11, 12, 14"
    areas: Recycling, waste separation, recycling contamination, single-use items, packaging, reusable alternatives

  - name: Accessibility & Equal Opportunities
    sdgs: "3, 4, 10, 11"
    areas: Persons with disabilities and special needs, invisible disabilities, accessibility, equal participation, inclusive design

  - name: Sustainable Transport & Urban Living
    sdgs: "9, 11, 13"
    areas: Public transport, active mobility, walking and cycling, first/last-mile travel, commuting, sustainable urban mobility

  - name: Community Well-being & Social Sustainability
    sdgs: "3, 10, 11, 12"
    areas: Ageing population, social connection, intergenerational relationships, digital inclusion, community participation, community well-being

  - name: Other (needs tutor approval)
    sdgs: "Any relevant SDG"
    areas: Any sustainability challenge in Singapore the student describes. Remind them it needs tutor approval.

deliverables:
  - name: Physical prototype
    guidance: A simple physical model or working prototype the group can build from low-cost materials and bring to class, e.g. a product, a kit, a game or a scale model.
  - name: Digital prototype
    guidance: 3 to 5 mock-up screens of an app, website or digital tool, made with free tools like Figma, Canva or Google Sites. It does not need to work fully.
