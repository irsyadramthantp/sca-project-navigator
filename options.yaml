# SCAIe dropdown options
# ---------------------------------------------------------------
# Edit this file to change what students can pick.
# - Keep the indentation (2 spaces) and the "- name:" pattern.
# - Text after "description: |" can run over several lines; just keep it indented.
# - Changes show up the next time the app reloads.

settings:
  ideas_per_run: 3              # how many project ideas per generation
  max_generations_per_day: 10   # per student per day; stops one student using up the API credits
  # Free tier: google_search false + gemini-3.5-flash-lite (about 500 runs a day, no web search).
  # Paid tier: google_search true + gemini-3.8-flash (real Singapore sources with links).
  google_search: false
  model: gemini-3.5-flash-lite  # Gemini model ID; check ai.google.dev/gemini-api/docs/changelog if it stops working

diplomas:
  - name: Common ICT Programme
    description: |
      A one-year common entry programme in the School of Informatics & IT, before students choose
      a diploma (Applied AI, Big Data & Analytics, Cybersecurity & Digital Forensics, Immersive
      Media & Game Development, or Information Technology). Students learn IT fundamentals:
      computational thinking, data visualisation and analytics, cybersecurity basics, database and
      application development, user experience and interface design, network and cloud technology.
      These are first-year students with foundation-level skills only.

  - name: Diploma in Applied Artificial Intelligence
    description: |
      Fundamental AI concepts and how to build smart applications for industries like healthcare,
      education, transport and manufacturing. After a common IT foundation year, students learn
      machine learning, deep learning, computer vision, natural language processing, conversational
      AI (chatbots), generative AI systems, AI agents and automation, and AI ethics. Graduates work
      as AI engineers, machine learning engineers, computer vision engineers, data analysts and
      software developers.

  - name: Diploma in Big Data & Analytics
    description: |
      Using data and analytics tools to give organisations data-driven insights. After a common IT
      foundation year, students learn data science, data mining and business analytics, data
      storytelling, data warehousing and business intelligence, data engineering in the cloud,
      quantitative analysis, machine learning for decision making, and text and social media
      analytics. Graduates work as data analysts, business intelligence analysts, data engineers
      and machine learning engineers.

  - name: Diploma in Cybersecurity & Digital Forensics
    description: |
      Protecting and defending computer systems, applications and networks, and investigating
      breaches by retrieving and reconstructing digital evidence. After a common IT foundation year,
      students learn ethical hacking and intrusion prevention, network security, secure web
      applications, digital forensics, incident response, and IT security management and audit,
      with hands-on training in an operational technology security lab, a security operations
      centre and a malware analysis centre. Graduates work as security operations analysts, cyber
      risk analysts, forensic investigators, penetration testers and IT security auditors.

  - name: Diploma in Immersive Media & Game Development
    description: |
      Creating games and interactive digital worlds, and using AR and VR for play, learning and work
      (e.g. VR training in healthcare, AR in hospitality, serious games in education). After a
      common IT foundation year, students learn game design and development with engines like
      Unity, 3D modelling, AR app development, computer graphics, immersive UI/UX, and maths and
      physics programming. Graduates work as game developers and designers, AR/VR developers, mobile
      app developers and UI/UX designers.

  - name: Diploma in Information Technology
    description: |
      Developing software solutions and AI-driven applications. After a common IT foundation year,
      students learn full stack web development, mobile app development, cloud application
      development, IoT (Internet of Things) application development, machine learning for
      developers, application security, DevOps, and agile methodology and design thinking.
      Electives include fintech and business analytics. Graduates work as application and mobile
      developers, software engineers, DevOps engineers, systems analysts and UI/UX designers.

themes:
  - name: Urban Biodiversity & City in Nature
    sdgs: "11, 13, 15"
    areas: Urban wildlife, natural habitats, biodiversity conservation, green spaces, human–nature relationships

  - name: Singapore's Food Security & Resilience
    sdgs: "2, 12, 13"
    areas: Food supply, food imports, local food production, food resilience, sustainable food sources

  - name: Reducing Food Waste & Responsible Eating
    sdgs: "2, 12, 13"
    areas: Food waste, portion sizes, consumption habits, food disposal, responsible eating

  - name: Sustainable Consumption & Circular Economy
    sdgs: "8, 12, 13"
    areas: Fast fashion, consumer behaviour, repair and reuse, sharing, upcycling, product life cycles

  - name: Waste, Recycling & Sustainable Packaging
    sdgs: "11, 12, 14"
    areas: Recycling, waste separation, recycling contamination, single-use items, packaging, reusable alternatives

  - name: Accessibility & Equal Opportunities
    sdgs: "3, 4, 10, 11"
    areas: Persons with disabilities and special needs, invisible disabilities, accessibility, equal participation, inclusive design

  - name: Sustainable Transport & Urban Living
    sdgs: "9, 11, 13"
    areas: Public transport, active mobility, walking and cycling, first/last-mile travel, commuting, sustainable urban mobility

  - name: Community Well-being & Social Sustainability
    sdgs: "3, 10, 11, 12"
    areas: Ageing population, social connection, intergenerational relationships, digital inclusion, community participation, community well-being

  - name: Other (needs tutor approval)
    sdgs: "Any relevant SDG"
    areas: Any sustainability challenge in Singapore the student describes. Remind them it needs tutor approval.

deliverables:
  - name: Physical prototype
    guidance: A simple physical model or working prototype the group can build from low-cost materials and bring to class, e.g. a product, a kit, a game or a scale model.
  - name: Digital prototype
    guidance: 3 to 5 mock-up screens of an app, website or digital tool, made with free tools like Figma, Canva or Google Sites. It does not need to work fully.
